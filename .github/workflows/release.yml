name: Release Builds

on:
  release:
    types: [published]
  # Also build on every branch push, uploading the same zips as workflow
  # artifacts instead of release assets (see the two upload steps below).
  # Without this, the native builds only ran when a release was published —
  # a clang-format include reorder broke the Windows build and survived four
  # commits before the next tag surfaced it.
  # 'branches: **' matches branch pushes only, so pushing a tag doesn't build
  # twice (once here, once for the release the tag creates).
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: poketrack-linux
            linux_deps: libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev
            cmake_flags: ""
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64
            linux_deps: libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev
            cmake_flags: ""
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64-drm
            linux_deps: libdrm-dev libgbm-dev libgles2-mesa-dev libasound2-dev
            cmake_flags: -DPLATFORM=DRM
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64-sdl
            linux_deps: libsdl2-dev libgles2-mesa-dev libasound2-dev
            cmake_flags: -DPLATFORM=SDL -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          - os: macos-latest
            name: poketrack-macos
            linux_deps: ""
            cmake_flags: ""
          - os: windows-latest
            name: poketrack-windows
            linux_deps: ""
            cmake_flags: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linux_deps }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        # Default (Visual Studio/MSVC) generator, not MinGW — the prebuilt
        # Wasmtime static libs wclap-bridge downloads are MSVC-only.

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release --parallel
        # --config Release matters for the MSVC generator on Windows (a
        # multi-config generator, defaults to Debug otherwise); harmless
        # no-op for the single-config Unix Makefiles generator elsewhere.

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cp build/poketrack poketrack
          zip ${{ matrix.name }}.zip poketrack

      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cp -R build/poketrack.app poketrack.app
          zip -r ${{ matrix.name }}.zip poketrack.app

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          # MSVC (multi-config) generator puts the binary under build/Release/,
          # not build/ directly like the single-config Unix generators.
          cp build/Release/poketrack.exe poketrack.exe
          Compress-Archive -Path poketrack.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.zip

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zip examples
        run: cd examples && zip -r ../examples.zip .
        # examples/plugins/*.wclap.wasm is checked in (built via `make plugins`),
        # so this is a plain zip — no build toolchain needed here.

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: examples.zip

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: examples.zip
