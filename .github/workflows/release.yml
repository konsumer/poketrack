name: Release Builds

on:
  release:
    types: [published]
  # Also build on every branch push, uploading the same zips as workflow
  # artifacts instead of release assets (see the two upload steps below).
  # Without this, the native builds only ran when a release was published —
  # a clang-format include reorder broke the Windows build and survived four
  # commits before the next tag surfaced it.
  # 'branches: **' matches branch pushes only, so pushing a tag doesn't build
  # twice (once here, once for the release the tag creates).
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: poketrack-linux
            linux_deps: libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev
            cmake_flags: ""
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64
            linux_deps: libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libasound2-dev
            cmake_flags: ""
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64-drm
            linux_deps: libdrm-dev libgbm-dev libgles2-mesa-dev libasound2-dev
            cmake_flags: -DPLATFORM=DRM
          - os: ubuntu-24.04-arm
            name: poketrack-linux-arm64-sdl
            linux_deps: libsdl2-dev libgles2-mesa-dev libasound2-dev
            cmake_flags: -DPLATFORM=SDL -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          - os: macos-latest
            name: poketrack-macos
            linux_deps: ""
            cmake_flags: ""
          - os: windows-latest
            name: poketrack-windows
            linux_deps: ""
            cmake_flags: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linux_deps }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        # Default (Visual Studio/MSVC) generator, not MinGW — the prebuilt
        # Wasmtime static libs wclap-bridge downloads are MSVC-only.

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release --parallel
        # --config Release matters for the MSVC generator on Windows (a
        # multi-config generator, defaults to Debug otherwise); harmless
        # no-op for the single-config Unix Makefiles generator elsewhere.

      - name: Build tests
        run: cmake --build build --config Release --target poketrack_tests --parallel
        # poketrack_tests is EXCLUDE_FROM_ALL, so the main Build step above
        # doesn't produce it — same target `make test` builds locally.

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cd build; ./Release/poketrack_tests.exe
        # Run from build/ (not build/Release/) so the tests' "../examples/..."
        # and "../plugins/..." relative paths resolve the same as they do on
        # the single-config generators below.

      - name: Run tests (non-Windows)
        if: runner.os != 'Windows'
        run: cd build && ./poketrack_tests

      # examples/ ships as a sibling of the binary in every platform zip (not
      # just a standalone download) so it's part of the same install
      # directory Steam updates on every release — see the file browser's
      # GetWorkingDirectory() root in src/file_browser.c. The plugins in it
      # are WASM (wasi-sdk), so one Linux build covers every platform; no
      # need to rebuild per-OS.
      - name: Download examples
        uses: actions/download-artifact@v7
        with:
          name: examples
          path: dl-examples

      - name: Unpack examples (non-Windows)
        if: runner.os != 'Windows'
        run: unzip -o dl-examples/examples.zip -d examples

      - name: Unpack examples (Windows)
        if: runner.os == 'Windows'
        run: Expand-Archive -Path dl-examples/examples.zip -DestinationPath examples -Force

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cp build/poketrack poketrack
          zip -r ${{ matrix.name }}.zip poketrack examples

      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cp -R build/poketrack.app poketrack.app
          zip -r ${{ matrix.name }}.zip poketrack.app examples

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          # MSVC (multi-config) generator puts the binary under build/Release/,
          # not build/ directly like the single-config Unix generators.
          # wasmtime.dll must ship alongside the .exe: Wasmtime is dynamically
          # linked on Windows (see cmake/patch-wclap-bridge.cmake), so the OS
          # loader needs it in the same directory at startup.
          cp build/Release/poketrack.exe poketrack.exe
          cp build/Release/wasmtime.dll wasmtime.dll
          Compress-Archive -Path poketrack.exe,wasmtime.dll,examples -DestinationPath ${{ matrix.name }}.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.zip

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pd2wclap toolchain (pdast, wasi-sdk)
        run: |
          git clone --depth 1 https://github.com/konsumer/pdast /tmp/pdast
          cargo install --path /tmp/pdast/pd2ast
          cargo install --path /tmp/pdast/pdast2wclap
          curl -sL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /tmp
          echo "WASI_SDK_PATH=/tmp/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"
        # pd2ast/pdast2wclap aren't published crates (no version to pin), and
        # the Makefile's own local dev instructions likewise just clone
        # main — matching that same convention here. build.sh fetches its
        # own CLAP headers on first run, so nothing else to set up for it.

      - name: Build example plugins
        run: make plugins
        # Builds karplus (npm/AssemblyScript) + robotalk (cargo) + the 3
        # pd2wclap demo patches into examples/plugins/ — none of that is
        # checked into git any more (see .gitignore).

      - name: Zip examples
        run: cd examples && zip -r ../examples.zip .

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: examples.zip

      # Always uploaded (not just for non-release events, unlike the other
      # jobs' artifact steps): the build job downloads this to fold examples/
      # into every platform zip, release or not.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: examples.zip

  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed
        if: github.event_name == 'release'
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

