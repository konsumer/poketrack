name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.14

      - name: Install wasi-sdk
        run: |
          curl -sL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /tmp
          echo "WASI_SDK_PATH=/tmp/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"
        # for the Syntakt WCLAP maker page (webroot/syntakt/): its plugin
        # template is C built with wasi-sdk, same version as release.yml

      - name: Build
        run: make build-web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: webroot/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
