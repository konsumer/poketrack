<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;}
  #capsule{position:relative;width:3840px;height:1240px;overflow:hidden;background:#0a1210;}
  #bg{position:absolute; inset:-12%; background-image:url('../../../art/horiz.png'); background-size:cover; background-position:center; filter: blur(100px) brightness(0.5) saturate(1.2); transform: scale(1.15);}
  #shade{position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.55) 100%);}
</style>
</head>
<body>
  <div id="capsule">
    <div id="bg"></div>
    <div id="shade"></div>
  </div>
</body>
</html>
