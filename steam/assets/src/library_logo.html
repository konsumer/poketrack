<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #capsule{position:relative;width:1280px;height:360px;overflow:hidden;background:transparent;}
  #logo{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif; font-weight:800; letter-spacing:-0.01em; font-size:160px; white-space:nowrap; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.85)) drop-shadow(0 0 40px rgba(0,0,0,0.6));}
  .poke{color:#f3f7f6;}
  .track{color:#5fd9c4; text-shadow:0 0 60px rgba(95,217,196,0.55);}
</style>
</head>
<body>
  <div id="capsule">
    <div id="logo"><span class="poke">POKE</span><span class="track">TRACK</span></div>
  </div>
</body>
</html>
